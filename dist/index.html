<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf2df"><meta name="apple-mobile-web-app-capable" content="yes"><title>몽글온실 · 작은 꽃의 커다란 발견</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="app.css?v=2"></head><body>
<header><a class="brand" href="./"><span>✿</span><div>몽글온실<small>PETITE BLOOM</small></div></a><div class="wallet"><span>✧</span> <b id="coins">0</b> <small>골드</small></div><button class="round" id="help" aria-label="게임 방법">?</button></header>
<main><div class="heading"><div><p class="eyebrow">나만의 작은 온실</p><h1>오늘은 어떤 색이 피어날까?</h1><p>물을 주고, 조금 기다리고. 세상에 없던 꽃을 만나봐요.</p></div><div class="weather">☀ <span>늘 포근한 오후<small>24° · 꽃이 좋아하는 날</small></span></div></div>
<section class="greenhouse" aria-label="꽃을 키우는 온실"><div class="glass"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="hill h1"></div><div class="hill h2"></div><div class="frames"></div></div><div class="hanging left">❧</div><div class="hanging right">❧</div><div class="sign">햇살 한 스푼, 다정함 두 스푼</div><div id="pots" class="pots"></div><div class="bench"></div><div class="floor"><span class="cat">ฅ^•ﻌ•^ฅ</span><span class="floor-note">천천히 자라도 괜찮아.</span><span class="can">♧</span></div></section>
<div class="toolbar"><span class="tip" id="tip">씨앗을 선택하고 빈 화분에 심어보세요.</span><span class="save" id="save">● 자동 저장</span></div>
<section class="workbench"><nav aria-label="온실 도구"><button data-tab="seeds" class="active">♧ 씨앗 보관함 <span id="seedCount"></span></button><button data-tab="breed">⚘ 꽃 교배</button><button data-tab="collection">✿ 꽃 도감</button><button data-tab="shop">✧ 작은 상점</button></nav><div id="panel"></div></section><footer>작은 씨앗에서 시작되는, 무한한 색의 이야기. <span>몽글온실 · 첫 번째 정원</span></footer></main>
<nav class="app-nav" aria-label="앱 메뉴"><button data-tab="seeds" class="active">♧<small>씨앗</small></button><button data-tab="breed">⚘<small>교배</small></button><button data-tab="collection">✿<small>도감</small></button><button data-tab="shop">✧<small>상점</small></button></nav><div id="toast" role="status" aria-live="polite"></div><dialog id="modal"><button class="close" aria-label="닫기">×</button><div id="modalContent"></div></dialog><script src="game.js"></script></body></html>
